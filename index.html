<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modern Life Residence - Portal Oficial de Gestão e Transparência</title>
  
  <!-- Meta SEO -->
  <meta name="description" content="Portal Oficial de Gestão, Transparência, Balancetes e Prestação de Contas do Condomínio Modern Life Residence. Síndico: Alessandro Cristiano da Silva.">
  <meta name="theme-color" content="#2E6B42">

  <!-- Icons Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- CSS Principal Responsivo -->
  <link rel="stylesheet" href="css/main.css?v=4">
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/lnovo.jpeg">

  <!-- Google Firebase Web SDK Compat (Sincronização em Tempo Real Celular/PC) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="app-container" id="appContainer">
    
    <!-- Sidebar Navegação Principal -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="assets/lnovo.jpeg" alt="Logo Modern Life" class="sidebar-logo">
        <div class="sidebar-title">
          Modern Life<br>
          <span style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">Residence</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-route="dashboard" onclick="App.navigateTo('dashboard')">
          <span class="material-symbols-outlined">dashboard</span> Página Inicial
        </button>

        <button class="nav-item" data-route="prestacao" onclick="App.navigateTo('prestacao')">
          <span class="material-symbols-outlined">analytics</span> Prestação de Contas
        </button>

        <button class="nav-item" data-route="balancetes" onclick="App.navigateTo('balancetes')">
          <span class="material-symbols-outlined">account_balance_wallet</span> Balancetes
        </button>

        <button class="nav-item" data-route="contratos" onclick="App.navigateTo('contratos')">
          <span class="material-symbols-outlined">description</span> Contratos
        </button>

        <button class="nav-item" data-route="transparencia" onclick="App.navigateTo('transparencia')">
          <span class="material-symbols-outlined">shield</span> Transparência
        </button>

        <button class="nav-item" data-route="documentos" onclick="App.navigateTo('documentos')">
          <span class="material-symbols-outlined">folder_open</span> Documentos &amp; Manuais
        </button>

        <button class="nav-item" data-route="recados" onclick="App.navigateTo('recados')">
          <span class="material-symbols-outlined">campaign</span> Mural de Recados
        </button>

        <button class="nav-item" data-route="ocorrencias" onclick="App.navigateTo('ocorrencias')">
          <span class="material-symbols-outlined">support_agent</span> Reclamações &amp; Elogios
        </button>

        <button class="nav-item" data-route="canal" onclick="App.navigateTo('canal')">
          <span class="material-symbols-outlined">mail</span> Canal Direto
        </button>

        <button class="nav-item" data-route="utilidades" onclick="App.navigateTo('utilidades')">
          <span class="material-symbols-outlined">build</span> Utilidades &amp; Reservas
        </button>

        <button class="nav-item" data-route="portaria" onclick="App.navigateTo('portaria')">
          <span class="material-symbols-outlined" style="color: #E65100;">door_front</span> Painel da Portaria
        </button>

        <button class="nav-item" data-route="agenda" onclick="App.navigateTo('agenda')">
          <span class="material-symbols-outlined">event</span> Agenda &amp; Calendário
        </button>

        <button class="nav-item" data-route="galeria" onclick="App.navigateTo('galeria')">
          <span class="material-symbols-outlined">photo_library</span> Galeria
        </button>

        <button class="nav-item" data-route="admin" onclick="App.navigateTo('admin')" style="margin-top: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 0.85rem;">
          <span class="material-symbols-outlined" style="color: var(--primary);">admin_panel_settings</span> Painel do Síndico
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge" onclick="AuthComponent.renderAuthModal()">
          <div class="user-avatar" id="sidebarUserAvatar">?</div>
          <div style="overflow: hidden;">
            <div style="font-weight: 700; font-size: 0.85rem; color: var(--primary-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="sidebarUserName">
              Visitante
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted);" id="sidebarUserRole">
              Clique para Entrar
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Conteúdo Principal Wrapper -->
    <div class="main-wrapper">
      
      <!-- Top Navbar Header -->
      <header class="app-header">
        <div class="header-title-container">
          <button class="mobile-toggle" onclick="App.toggleMobileSidebar()" aria-label="Abrir Menu">
            <span class="material-symbols-outlined" style="font-size: 1.8rem;">menu</span>
          </button>
          <div class="header-title" id="pageHeaderTitle">Modern Life Residence</div>
        </div>

        <div class="header-actions">
          <button class="btn-secondary btn-sm" onclick="App.openGlobalSearchModal()" title="Pesquisar (Ctrl+K)">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">search</span>
          </button>

          <button class="btn-secondary btn-sm" onclick="App.toggleTheme()" title="Alternar Tema">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">dark_mode</span>
          </button>

          <button class="btn-primary btn-sm" onclick="AuthComponent.renderAuthModal()">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">account_circle</span>
            <span class="btn-text">Entrar</span>
          </button>
        </div>
      </header>

      <!-- Conteúdo da Página Atual Renderizado Via JS -->
      <main class="page-content" id="pageContent">
        <!-- Render dinâmico dos componentes -->
      </main>

      <!-- Rodapé Institucional com Gestão do Síndico -->
      <footer class="app-footer">
        <div style="max-width: 900px; margin: 0 auto; padding: 0 1rem;">
          <p style="font-size: 0.88rem; color: var(--text-main); font-weight: 600; margin-bottom: 0.4rem;">
            Gestão do Síndico Alessandro Cristiano da Silva &bull; E-mail oficial: <code>condominio.modern.life@gmail.com</code>
          </p>
          <p style="font-size: 0.78rem; color: var(--text-muted);">
            O acesso às informações e documentos do portal exige cadastro e aprovação por e-mail &bull; Modern Life Residence &copy; 2026
          </p>
        </div>
      </footer>

    </div>
  </div>

  <!-- Scripts JavaScript da Aplicação -->
  <script src="js/store.js?v=4"></script>
  <script src="js/firebase-config.js?v=4"></script>
  <script src="js/components/auth.js?v=4"></script>
  <script src="js/components/dashboard.js?v=4"></script>
  <script src="js/components/prestacao.js?v=4"></script>
  <script src="js/components/balancetes.js?v=4"></script>
  <script src="js/components/contratos.js?v=4"></script>
  <script src="js/components/transparencia.js?v=4"></script>
  <script src="js/components/documentos.js?v=4"></script>
  <script src="js/components/recados.js?v=4"></script>
  <script src="js/components/ocorrencias.js?v=4"></script>
  <script src="js/components/canal.js?v=4"></script>
  <script src="js/components/utilidades.js?v=4"></script>
  <script src="js/components/portaria.js?v=4"></script>
  <script src="js/components/agenda.js?v=4"></script>
  <script src="js/components/galeria.js?v=4"></script>
  <script src="js/components/admin.js?v=4"></script>
  <script src="js/app.js?v=4"></script>

</body>
</html>
